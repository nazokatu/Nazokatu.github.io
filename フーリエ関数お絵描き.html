                extend: {

            <!-- Saved List Container -->

        <!-- Controls -->
        <div class="space-y-4 pt-2 border-t border-slate-800">
            <!-- Circle Count Slider & Fine-Tuning Controls -->
            <div class="space-y-1.5">
                <div class="flex justify-between items-center">
                    <label for="circleSlider" class="text-xs font-medium text-slate-300 flex items-center gap-1.5">

                        円の数:

                        <span id="circleVal" class="text-xs font-mono font-bold text-cyan-400 bg-slate-800 px-2.5 py-0.5 rounded border border-slate-700 min-w-[2.5rem] text-center">30</span>
                        <button onclick="stepCircles(1)" class="w-6 h-6 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 border border-slate-700 rounded text-xs font-bold text-slate-300 flex items-center justify-center">+</button>
                    </div>
                </div>

                <input type="range" id="circleSlider" min="1" max="80" value="30" class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-cyan-400" oninput="updateCircles(this.value)">

                <!-- Quick Circle Presets -->
                <div class="flex justify-between items-center gap-1 pt-1">
                    <span class="text-[10px] text-slate-500">クイック選択:</span>

                        <button onclick="updateCircles(15)" class="px-1.5 py-0.5 bg-slate-800 hover:bg-cyan-900/60 border border-slate-700 rounded text-[10px] text-cyan-300 font-mono">15</button>
                        <button onclick="updateCircles(30)" class="px-1.5 py-0.5 bg-slate-800 hover:bg-cyan-900/60 border border-slate-700 rounded text-[10px] text-cyan-300 font-mono">30</button>
                        <button onclick="updateCircles(50)" class="px-1.5 py-0.5 bg-slate-800 hover:bg-cyan-900/60 border border-slate-700 rounded text-[10px] text-cyan-300 font-mono">50</button>
                        <button onclick="updateCircles(80)" class="px-1.5 py-0.5 bg-slate-800 hover:bg-cyan-900/60 border border-slate-700 rounded text-[10px] text-cyan-300 font-mono">80</button>
                    </div>
                </div>
            </div>

            <!-- Speed Slider -->
            <div>
                <div class="flex justify-between items-center mb-1">

                        <i data-lucide="gauge" class="w-3.5 h-3.5 text-cyan-400"></i>
                        描画速度:

                </div>
                <input type="range" id="speedSlider" min="0.1" max="3" step="0.1" value="1" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-cyan-400" oninput="updateSpeed(this.value)">

            <!-- Display Toggles -->
            <div class="space-y-2 pt-2 border-t border-slate-800/80">

                    </span>
                    <input type="checkbox" id="showCirclesCheck" checked onchange="draw()" class="w-4 h-4 rounded bg-slate-800 border-slate-700 text-cyan-500 focus:ring-0 focus:ring-offset-0 cursor-pointer accent-cyan-500">
                </label>
                <label class="flex items-center justify-between text-xs text-slate-300 cursor-pointer">

                    </span>
                    <input type="checkbox" id="showOriginalCheck" checked onchange="draw()" class="w-4 h-4 rounded bg-slate-800 border-slate-700 text-cyan-500 focus:ring-0 focus:ring-offset-0 cursor-pointer accent-cyan-500">
                </label>

        <!-- Explanation Modal / Toggle -->
        <div class="mt-auto pt-4 border-t border-slate-800">
            <details class="group">

                    <i data-lucide="help-circle" class="w-4 h-4"></i>
                    <span>回転する円で絵が描ける仕組み？</span>
                </summary>
                <div class="mt-2 text-[11px] text-slate-400 leading-relaxed space-y-1.5 bg-slate-950/60 p-2.5 rounded-lg border border-slate-800">
                    <p><strong class="text-slate-200">複素フーリエ級数</strong>と呼ばれる数学の道具を使っています。</p>
                    <p>どんな複雑な閉曲線（一筆書きの図形）も、**「半径」「回転の速さ」「初期の向き」が異なる複数の円（ベクトル）を連結させて回転させた先端の軌跡**として分解・再現することができます。</p>
                </div>
            </details>
        </div>

    <!-- Main Canvas Area -->
    <div class="flex-1 relative bg-slate-950 flex items-center justify-center overflow-hidden">
        <canvas id="canvas" class="w-full h-full cursor-crosshair block"></canvas>

        <!-- Canvas Floating Hints -->
        <div id="drawPrompt" class="absolute pointer-events-none text-slate-500 text-sm flex items-center gap-2 bg-slate-900/80 backdrop-blur-sm border border-slate-800 px-4 py-2 rounded-full shadow-2xl transition-opacity opacity-0">
            <i data-lucide="pencil" class="w-4 h-4 animate-bounce text-cyan-400"></i>
            <span>画面にドラッグして好きな絵を描いてみよう</span>
        </div>
    </div>

    <script>
        /* Discrete Fourier Transform (DFT) Engine & Interactive Animation */

        // Canvas & Context Setup
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // App States
        let rawPoints = [];        // Raw points drawn by user [{x, y}]
        let fourierData = [];      // Calculated Fourier coefficients
        let pathTrace = [];        // Traced points rendered by Fourier tip
        let isDrawing = false;
        let isPlaying = true;
        let time = 0;
        let numCircles = 30;
        let animationSpeed = 1.0;

        // Toast Notification Helper
        function showToast(msg) {
            const toast = document.getElementById('toastMessage');
            const toastText = document.getElementById('toastText');
            toastText.textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        // Handle Canvas Resizing
        function resizeCanvas() {
            if (!canvas.parentElement) return;
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            draw();
        }
        window.addEventListener('resize', resizeCanvas);

        // Path Resampling Function to ensure uniform point spacing
        function resamplePath(pts, numSamples) {
            if (pts.length === 0) return [];
            let totalLength = 0;
            const distances = [0];
            for (let i = 0; i < pts.length - 1; i++) {
                const dist = Math.hypot(pts[i+1].x - pts[i].x, pts[i+1].y - pts[i].y);
                totalLength += dist;
                distances.push(totalLength);
            }
            if (totalLength === 0) return Array(numSamples).fill(pts[0]);

            const step = totalLength / numSamples;
            const resampled = [];
            let currIdx = 0;

            for (let i = 0; i < numSamples; i++) {
                const targetDist = i * step;
                while (currIdx < distances.length - 1 && distances[currIdx + 1] < targetDist) {
                    currIdx++;
                }
                if (currIdx >= distances.length - 1) {
                    resampled.push({ ...pts[pts.length - 1] });
                } else {
                    const p1 = pts[currIdx];
                    const p2 = pts[currIdx + 1];
                    const d1 = distances[currIdx];
                    const d2 = distances[currIdx + 1];
                    const t = (targetDist - d1) / (d2 - d1 || 1);
                    resampled.push({
                        x: p1.x + (p2.x - p1.x) * t,
                        y: p1.y + (p2.y - p1.y) * t
                    });
                }
            }
            return resampled;
        }

        // Discrete Fourier Transform (DFT) Algorithm
        function dft(points) {
            const X = [];
            const N = points.length;
            
            for (let k = 0; k < N; k++) {
                let re = 0;
                let im = 0;
                // Generate frequencies in sequence: 0, 1, -1, 2, -2, ...
                const freq = k % 2 === 0 ? k / 2 : -Math.ceil(k / 2);

                for (let n = 0; n < N; n++) {
                    const phi = (2 * Math.PI * freq * n) / N;
                    re += points[n].x * Math.cos(phi) + points[n].y * Math.sin(phi);
                    im += points[n].y * Math.cos(phi) - points[n].x * Math.sin(phi);
                }

                re /= N;
                im /= N;

                const amp = Math.hypot(re, im);
                const phase = Math.atan2(im, re);

                X.push({ freq, amp, phase, re, im });
            }

            // Sort coefficients by amplitude descending
            X.sort((a, b) => b.amp - a.amp);
            return X;
        }

        // Process User Drawing or Preset Points
        function processPoints(pts) {
            if (pts.length < 2) return;
            
            // Resample path to fixed resolution for crisp DFT
            const sampled = resamplePath(pts, 400);
            rawPoints = sampled;

            // Calculate Fourier Transform
            fourierData = dft(rawPoints);
            
            // Reset Animation Tracking
            pathTrace = [];
            time = 0;

            // Set default circle slider bounds
            const sliderMax = Math.min(80, fourierData.length);
            circleSlider.max = sliderMax;
            if (numCircles > sliderMax) {
                numCircles = sliderMax;
            }
            circleSlider.value = numCircles;
            circleVal.textContent = numCircles;

            // Update Status Banner
            statusBanner.className = "p-3 rounded-lg text-xs flex items-center justify-between transition-colors bg-emerald-950/60 border border-emerald-800/50 text-emerald-200";
            statusText.textContent = `解析完了 (円の数: ${numCircles}個)`;
            statusIcon.setAttribute('data-lucide', 'check-circle-2');
            lucide.createIcons();

            hidePrompt();
        }

        // User Input Event Listeners (Mouse & Touch)
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startDrawing(e) {
            e.preventDefault();
            isDrawing = true;
            rawPoints = [getPos(e)];
            fourierData = [];
            pathTrace = [];
            time = 0;

            statusBanner.className = "p-3 rounded-lg text-xs flex items-center justify-between transition-colors bg-amber-950/60 border border-amber-800/50 text-amber-200";
            statusText.textContent = "図形を描画中...";
            statusIcon.setAttribute('data-lucide', 'pencil');
            lucide.createIcons();
        }

        function drawMove(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getPos(e);
            
            // Avoid inserting identical adjacent points
            const lastPos = rawPoints[rawPoints.length - 1];
            const dist = Math.hypot(pos.x - lastPos.x, pos.y - lastPos.y);
            if (dist > 3) {
                rawPoints.push(pos);
            }
            draw();
        }

        function stopDrawing(e) {
            if (!isDrawing) return;
            isDrawing = false;
            if (rawPoints.length > 5) {
                processPoints(rawPoints);
            } else {
                clearCanvas();
            }
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', drawMove);
        window.addEventListener('mouseup', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', drawMove, { passive: false });
        window.addEventListener('touchend', stopDrawing);

        // Helper Functions & Controls
        function togglePlay() {
            isPlaying = !isPlaying;
            if (isPlaying) {
                playIcon.setAttribute('data-lucide', 'pause');
                playText.textContent = "一時停止";
            } else {
                playIcon.setAttribute('data-lucide', 'play');
                playText.textContent = "再生";
            }
            lucide.createIcons();
        }

        function resetAnimation() {
            time = 0;
            pathTrace = [];
            if (!isPlaying) togglePlay();
        }

        function updateCircles(val) {
            numCircles = Math.max(1, Math.min(parseInt(val), fourierData.length || 80));
            circleSlider.value = numCircles;
            circleVal.textContent = numCircles;
            pathTrace = []; // Reset current trace line for clarity
        }

        function stepCircles(delta) {
            updateCircles(numCircles + delta);
        }

        function updateSpeed(val) {
            animationSpeed = parseFloat(val);
            speedVal.textContent = `${val}x`;
        }

        function clearCanvas() {
            rawPoints = [];
            fourierData = [];
            pathTrace = [];
            time = 0;

            statusBanner.className = "p-3 rounded-lg text-xs flex items-center justify-between transition-colors bg-cyan-950/60 border border-cyan-800/50 text-cyan-200";
            statusText.textContent = "キャンバスにマウスや指で絵を描いてください";
            statusIcon.setAttribute('data-lucide', 'pen-tool');
            lucide.createIcons();

            showPrompt();
            draw();
        }

        function showPrompt() {
            drawPrompt.style.opacity = '1';
        }

        function hidePrompt() {
            drawPrompt.style.opacity = '0';
        }

        function loadPreset(type) {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const scale = Math.min(canvas.width, canvas.height) * 0.35;
            const pts = [];
            const numPts = 300;

            if (type === 'glasses') {
                // Stylish Glasses (眼鏡) with lenses, bridge, and temples
                const s = scale * 0.8;
                const rx = s * 0.32;
                const ry = s * 0.24;
                const leftCx = cx - s * 0.42;
                const rightCx = cx + s * 0.42;
                const eyeY = cy - s * 0.05;

                // 1. Left Lens Rim
                for (let i = 0; i <= 60; i++) {
                    const a = (i / 60) * Math.PI * 2;
                    pts.push({ x: leftCx + Math.cos(a) * rx, y: eyeY + Math.sin(a) * ry });
                }

                // 2. Left Temple Arm
                const leftTempleX = leftCx - rx;
                for (let i = 0; i <= 20; i++) {
                    const t = i / 20;
                    pts.push({ x: leftTempleX - t * s * 0.35, y: eyeY - t * s * 0.2 });
                }
                for (let i = 0; i <= 15; i++) {
                    const t = i / 15;
                    pts.push({ x: leftTempleX - s * 0.35 - t * s * 0.05, y: eyeY - s * 0.2 + t * s * 0.2 });
                }
                for (let i = 35; i >= 0; i--) {
                    const t = i / 35;
                    pts.push({ x: leftTempleX - t * s * 0.38, y: eyeY - t * s * 0.1 });
                }

                // 3. Bridge to Right Lens
                for (let i = 0; i <= 30; i++) {
                    const t = i / 30;
                    const bridgeX = (leftCx + rx) * (1 - t) + (rightCx - rx) * t;
                    const bridgeY = eyeY - Math.sin(t * Math.PI) * s * 0.12;
                    pts.push({ x: bridgeX, y: bridgeY });
                }

                // 4. Right Lens Rim
                for (let i = 0; i <= 60; i++) {
                    const a = (i / 60) * Math.PI * 2;
                    pts.push({ x: rightCx + Math.cos(a) * rx, y: eyeY + Math.sin(a) * ry });
                }

                // 5. Right Temple Arm
                const rightTempleX = rightCx + rx;
                for (let i = 0; i <= 20; i++) {
                    const t = i / 20;
                    pts.push({ x: rightTempleX + t * s * 0.35, y: eyeY - t * s * 0.2 });
                }
                for (let i = 0; i <= 15; i++) {
                    const t = i / 15;
                    pts.push({ x: rightTempleX + s * 0.35 + t * s * 0.05, y: eyeY - s * 0.2 + t * s * 0.2 });
                }
                for (let i = 35; i >= 0; i--) {
                    const t = i / 35;
                    pts.push({ x: rightTempleX + t * s * 0.38, y: eyeY - t * s * 0.1 });
                }

                // 6. Return across bridge
                for (let i = 30; i >= 0; i--) {
                    const t = i / 30;
                    const bridgeX = (leftCx + rx) * (1 - t) + (rightCx - rx) * t;
                    const bridgeY = eyeY - Math.sin(t * Math.PI) * s * 0.08;
                    pts.push({ x: bridgeX, y: bridgeY });
                }
            } else if (type === 'flower') {
                // Complete Flower with Stem & Leaves (花：茎と葉っぱ付き)
                const s = scale * 0.85;
                const flowerCy = cy - s * 0.25;

                // 1. Flower Petals (5 Petal Pattern)
                const petalPts = 120;
                for (let i = 0; i <= petalPts; i++) {
                    const a = (i / petalPts) * Math.PI * 2;
                    const r = s * (0.22 + 0.18 * Math.sin(5 * a));
                    pts.push({
                        x: cx + r * Math.cos(a),
                        y: flowerCy + r * Math.sin(a)
                    });
                }

                // 2. Stem Down to Left Leaf
                const stemStartY = flowerCy + s * 0.12;
                const leafLeftY = cy + s * 0.05;
                for (let i = 0; i <= 20; i++) {
                    const t = i / 20;
                    pts.push({ x: cx, y: stemStartY * (1 - t) + leafLeftY * t });
                }

                // 3. Left Leaf
                for (let i = 0; i <= 40; i++) {
                    const a = (i / 40) * Math.PI * 2;
                    const lx = cx - s * 0.22 + Math.cos(a) * s * 0.2;
                    const ly = leafLeftY + Math.sin(a) * s * 0.08 - (1 - Math.cos(a)) * s * 0.05;
                    pts.push({ x: lx, y: ly });
                }

                // 4. Stem Down to Right Leaf
                const leafRightY = cy + s * 0.25;
                for (let i = 0; i <= 20; i++) {
                    const t = i / 20;
                    pts.push({ x: cx, y: leafLeftY * (1 - t) + leafRightY * t });
                }

                // 5. Right Leaf
                for (let i = 0; i <= 40; i++) {
                    const a = (i / 40) * Math.PI * 2;
                    const rx = cx + s * 0.22 + Math.cos(a) * s * 0.2;
                    const ry = leafRightY + Math.sin(a) * s * 0.08 - (1 - Math.cos(a)) * s * 0.05;
                    pts.push({ x: rx, y: ry });
                }

                // 6. Stem Down to Root
                const stemBottomY = cy + s * 0.55;
                for (let i = 0; i <= 20; i++) {
                    const t = i / 20;
                    pts.push({ x: cx, y: leafRightY * (1 - t) + stemBottomY * t });
                }

                // 7. Stem Return Back Up to Flower Center
                for (let i = 40; i >= 0; i--) {
                    const t = i / 40;
                    pts.push({ x: cx, y: stemStartY * (1 - t) + stemBottomY * t });
                }
            } else if (type === 'star') {
                // Sharp 5-pointed Star
                const outerRadius = scale * 0.85;
                const innerRadius = scale * 0.33;
                const pointsCount = 10;
                for (let i = 0; i <= pointsCount; i++) {
                    const angle = (i / pointsCount) * Math.PI * 2 - Math.PI / 2;
                    const r = (i % 2 === 0) ? outerRadius : innerRadius;
                    pts.push({
                        x: cx + r * Math.cos(angle),
                        y: cy + r * Math.sin(angle)
                    });
                }
            } else if (type === 'note') {
                // Single-stroke Quarter Note (🎵)
                const baseS = scale * 0.6;
                // Oval Head
                for (let i = 0; i <= 40; i++) {
                    const a = (i / 40) * Math.PI * 2;
                    pts.push({
                        x: cx - baseS * 0.3 + Math.cos(a) * baseS * 0.3,
                        y: cy + baseS * 0.4 + Math.sin(a) * baseS * 0.22 - Math.cos(a) * baseS * 0.1
                    });
                }
                // Vertical Stem Up
                for (let i = 0; i <= 30; i++) {
                    const t = i / 30;
                    pts.push({
                        x: cx,
                        y: (cy + baseS * 0.4) * (1 - t) + (cy - baseS * 0.6) * t
                    });
                }
                // Flag / Hook Curve
                for (let i = 0; i <= 30; i++) {
                    const t = i / 30;
                    const angle = t * Math.PI * 0.75;
                    pts.push({
                        x: cx + Math.sin(angle) * baseS * 0.4,
                        y: cy - baseS * 0.6 + (1 - Math.cos(angle)) * baseS * 0.3
                    });
                }
                // Return Stem Down
                for (let i = 30; i >= 0; i--) {
                    const t = i / 30;
                    pts.push({
                        x: cx,
                        y: (cy + baseS * 0.4) * (1 - t) + (cy - baseS * 0.6) * t
                    });
                }
            } else if (type === 'heart') {
                for (let i = 0; i < numPts; i++) {
                    const t = (i / numPts) * Math.PI * 2;
                    let x = 16 * Math.pow(Math.sin(t), 3);
                    let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                    pts.push({
                        x: cx + x * (scale / 18),
                        y: cy + y * (scale / 18)
                    });
                }
            } else if (type === 'butterfly') {
                for (let i = 0; i < numPts; i++) {
                    const t = (i / numPts) * Math.PI * 2;
                    const r = scale * 0.38 * (Math.exp(Math.cos(t)) - 2 * Math.cos(4*t) - Math.pow(Math.sin(t/12), 5));
                    pts.push({
                        x: cx + r * Math.sin(t),
                        y: cy - r * Math.cos(t)
                    });
                }
            }

            processPoints(pts);
        }

        let savedShapes = [];

        function loadSavedShapesFromStorage() {
            try {
                const data = localStorage.getItem('fourier_saved_shapes');
                if (data) {
                    savedShapes = JSON.parse(data);
                    renderSavedShapesList();
                }
            } catch (e) {
                console.error("Storage load failed", e);
            }
        }

        function saveCurrentShape() {
            if (rawPoints.length < 5) {
                showToast("キャンバスに図形を描いてから保存してください");
                return;
            }

            const input = document.getElementById('shapeNameInput');
            let name = input.value.trim();
            if (!name) {
                name = `マイ図形 ${savedShapes.length + 1}`;
            }

            // Normalize points relative to canvas center
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const relPts = rawPoints.map(p => ({ x: p.x - cx, y: p.y - cy }));

            savedShapes.push({
                id: Date.now(),
                name: name.slice(0, 10),
                points: relPts
            });

            try {
                localStorage.setItem('fourier_saved_shapes', JSON.stringify(savedShapes));
            } catch (e) {}

            input.value = '';
            renderSavedShapesList();
            showToast(`「${name}」を保存しました！`);
        }

        function renderSavedShapesList() {
            const listEl = document.getElementById('savedShapesList');
            const emptyHint = document.getElementById('emptySavedHint');

            if (savedShapes.length === 0) {
                if (emptyHint) emptyHint.style.display = 'inline';
                listEl.innerHTML = '';
                if (emptyHint) listEl.appendChild(emptyHint);
                return;
            }

            listEl.innerHTML = '';
            savedShapes.forEach(item => {
                const btnGroup = document.createElement('div');
                btnGroup.className = "flex items-center bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded px-2 py-1 text-xs gap-1 transition";

                const loadBtn = document.createElement('button');
                loadBtn.className = "text-cyan-300 font-medium truncate max-w-[5.5rem] text-left";
                loadBtn.textContent = item.name;
                loadBtn.onclick = () => loadSavedShape(item.id);

                const delBtn = document.createElement('button');
                delBtn.className = "text-slate-500 hover:text-rose-400 p-0.5 transition";
                delBtn.innerHTML = `<i data-lucide="x" class="w-3 h-3"></i>`;
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteSavedShape(item.id);
                };

                btnGroup.appendChild(loadBtn);
                btnGroup.appendChild(delBtn);
                listEl.appendChild(btnGroup);
            });
            lucide.createIcons();
        }

        function loadSavedShape(id) {
            const item = savedShapes.find(s => s.id === id);
            if (!item) return;

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const absPts = item.points.map(p => ({ x: p.x + cx, y: p.y + cy }));

            processPoints(absPts);
            showToast(`「${item.name}」を読み込みました`);
        }

        function deleteSavedShape(id) {
            savedShapes = savedShapes.filter(s => s.id !== id);
            try {
                localStorage.setItem('fourier_saved_shapes', JSON.stringify(savedShapes));
            } catch (e) {}
            renderSavedShapesList();
        }

        function renderEpicycles(x, y, rotation) {
            const showCircles = showCirclesCheck.checked;
            const count = Math.min(numCircles, fourierData.length);

            for (let i = 0; i < count; i++) {
                const prevX = x;
                const prevY = y;
                const { freq, amp, phase } = fourierData[i];

                // Compute angle based on frequency and current time
                const angle = freq * time + phase + rotation;
                x += amp * Math.cos(angle);
                y += amp * Math.sin(angle);

                if (showCircles && amp > 0.5) {
                    // High-visibility glowing circle stroke
                    ctx.beginPath();
                    ctx.arc(prevX, prevY, amp, 0, Math.PI * 2);
                    ctx.strokeStyle = i === 0 
                        ? 'rgba(6, 182, 212, 0.75)' 
                        : (i % 2 === 0 ? 'rgba(56, 189, 248, 0.45)' : 'rgba(168, 85, 247, 0.45)');
                    ctx.lineWidth = i === 0 ? 2 : 1.2;
                    ctx.stroke();

                    // Crisp bright arm vector line
                    ctx.beginPath();
                    ctx.moveTo(prevX, prevY);
                    ctx.lineTo(x, y);
                    ctx.strokeStyle = i === 0 ? '#38bdf8' : 'rgba(244, 114, 182, 0.85)';
                    ctx.lineWidth = i < 3 ? 2 : 1.2;
                    ctx.stroke();
                    
                    // Joint Dot at center and tip
                    ctx.beginPath();
                    ctx.arc(x, y, i < 5 ? 2.5 : 1.5, 0, Math.PI * 2);
                    ctx.fillStyle = '#22d3ee';
                    ctx.fill();
                }
            }

            return { x, y };
        }

        // Main Animation & Drawing Frame Loop
        function draw() {
            // Clear Canvas with Dark Gradient
            ctx.fillStyle = '#0b0f19';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Subtle Background Grid Pattern
            ctx.strokeStyle = 'rgba(30, 41, 59, 0.4)';
            ctx.lineWidth = 1;
            const gridSize = 40;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Draw Original User Path Guide (if enabled and exists)
            if (showOriginalCheck.checked && rawPoints.length > 0) {
                ctx.beginPath();
                ctx.moveTo(rawPoints[0].x, rawPoints[0].y);
                for (let i = 1; i < rawPoints.length; i++) {
                    ctx.lineTo(rawPoints[i].x, rawPoints[i].y);
                }
                ctx.closePath();
                ctx.strokeStyle = 'rgba(71, 85, 105, 0.4)';
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 4]);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // If user is currently drawing, render real-time stroke
            if (isDrawing && rawPoints.length > 0) {
                ctx.beginPath();
                ctx.moveTo(rawPoints[0].x, rawPoints[0].y);
                for (let i = 1; i < rawPoints.length; i++) {
                    ctx.lineTo(rawPoints[i].x, rawPoints[i].y);
                }
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
                return;
            }

            // Animate Epicycles & Trace Line
            if (fourierData.length > 0) {
                const v = renderEpicycles(0, 0, 0);
                pathTrace.unshift(v);

                // Keep trace stored max for one full loop
                if (pathTrace.length > fourierData.length) {
                    pathTrace.pop();
                }

                // Draw Glowing Traced Fourier Path
                if (pathTrace.length > 1) {
                    // Outer Cyan Glow
                    ctx.beginPath();
                    ctx.moveTo(pathTrace[0].x, pathTrace[0].y);
                    for (let i = 1; i < pathTrace.length; i++) {
                        ctx.lineTo(pathTrace[i].x, pathTrace[i].y);
                    }
                    ctx.strokeStyle = 'rgba(6, 182, 212, 0.4)';
                    ctx.lineWidth = 8;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.stroke();

                    // Inner Sharp Bright Neon Stroke
                    ctx.beginPath();
                    ctx.moveTo(pathTrace[0].x, pathTrace[0].y);
                    for (let i = 1; i < pathTrace.length; i++) {
                        ctx.lineTo(pathTrace[i].x, pathTrace[i].y);
                    }
                    ctx.strokeStyle = '#22d3ee';
                    ctx.lineWidth = 2.5;
                    ctx.stroke();
                }

                // Tip Tracer Glow Dot
                ctx.beginPath();
                ctx.arc(v.x, v.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = '#06b6d4';
                ctx.shadowBlur = 12;
                ctx.fill();
                ctx.shadowBlur = 0; // Reset shadow

                // Update Time Step if playing
                if (isPlaying) {
                    const dt = (2 * Math.PI) / fourierData.length;
                    time += dt * animationSpeed;

                    // Reset time loop gracefully
                    if (time >= 2 * Math.PI) {
                        time = 0;
                        pathTrace = []; // Refresh trace line smoothly
                    }
                }
            }
        }

        // Main Loop Driver
        function animate() {
            draw();
            requestAnimationFrame(animate);
        }

        // Initialization
        window.onload = function() {
            lucide.createIcons();
            resizeCanvas();
            showPrompt();
            loadSavedShapesFromStorage();
            
            // Load default preset "Glasses" on start
            setTimeout(() => {
                loadPreset('glasses');
            }, 300);

            animate();
        };
    </script>
</body>
</html>
